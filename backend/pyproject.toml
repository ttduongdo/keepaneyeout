[project]
name = "ai-research-radar-backend"
version = "0.1.0"
description = "Baseline backend for Pinsight"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "openai>=1.51.0",
  "pgvector>=0.3.3",
  "praw>=7.7.1",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.0",
  "pymupdf>=1.24.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-jose>=3.3.0",
  "python-dateutil>=2.9.0",
  "markdown>=3.7",
  "resend>=2.4.0",
  "readability-lxml>=0.8.1",
  "scikit-learn>=1.5.0",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.31.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
